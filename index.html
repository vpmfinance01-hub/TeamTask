<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TeamTasks" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TeamTasks – задачи за персонала</title>
    <script>
      // изгледът се задава преди първото рисуване, за да няма просветване
      try {
        var d = document.documentElement;
        d.dataset.theme = localStorage.getItem("teamtasks.theme") === "classic" ? "classic" : "studio";
        d.dataset.fx = localStorage.getItem("teamtasks.fx") === "off" ? "off" : "on";
      } catch (e) {
        document.documentElement.dataset.theme = "studio";
        document.documentElement.dataset.fx = "on";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
